<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llama-cpp-webui</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-0: #0a0a0c;
    --bg-1: #111115;
    --bg-2: #19191f;
    --bg-3: #222230;
    --border: #2a2a36;
    --border-focus: #3d3d50;
    --text-0: #e8e6f0;
    --text-1: #a8a6b4;
    --text-2: #6e6c7e;
    --accent: #e8922f;
    --accent-dim: #c47520;
    --accent-glow: rgba(232, 146, 47, 0.12);
    --green: #3dd68c;
    --green-dim: rgba(61, 214, 140, 0.12);
    --red: #f04e6a;
    --red-dim: rgba(240, 78, 106, 0.10);
    --blue: #5b9cf5;
    --blue-dim: rgba(91, 156, 245, 0.10);
    --radius: 8px;
    --font-sans: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html { font-size: 15px; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--text-0);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  #root { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Header ────────────────────────────── */
  .header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent) 0%, #f0c060 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .version {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-2);
    border: 1px solid var(--border);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }
  .tabs { margin-left: auto; display: flex; gap: 0.4rem; }
  .tab {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-2);
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab.active {
    border-color: var(--accent);
    background: var(--accent-glow);
    color: var(--accent);
  }

  /* ── Section cards ─────────────────────── */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card-title {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card-title .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-idle { background: var(--text-2); }
  .dot-ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-warn { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot-err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot-spin {
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }

  /* ── Info row ──────────────────────────── */
  .info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-bottom: 1rem;
  }
  .info-item label {
    display: block;
    font-size: 0.68rem;
    font-family: var(--font-mono);
    color: var(--text-2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }
  .info-item span {
    font-size: 0.88rem;
    color: var(--text-1);
    font-family: var(--font-mono);
    word-break: break-all;
  }

  /* ── Buttons ───────────────────────────── */
  button {
    font-family: var(--font-sans);
    font-size: 0.82rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--bg-3);
    color: var(--text-1);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--border-focus); }
  .btn-danger {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid transparent;
  }
  .btn-danger:hover { border-color: var(--red); }
  .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.75rem; }

  /* ── Inputs ────────────────────────────── */
  input[type="text"], input[type="number"], input[type="url"], select {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
    color: var(--text-0);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-2); }
  select option {
    background: var(--bg-1);
    color: var(--text-0);
  }

  /* ── Log box ───────────────────────────── */
  .log-box {
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    line-height: 1.5;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 0.75rem;
  }

  /* ── Model list ────────────────────────── */
  .model-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  .model-row:last-child { border-bottom: none; }
  .model-name {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--text-0);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-size {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-2);
    flex-shrink: 0;
  }

  /* ── Progress bar ──────────────────────── */
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--bg-0);
    border-radius: 3px;
    margin-top: 0.5rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f0c060);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* ── Download item ─────────────────────── */
  .download-item {
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  .download-item:last-child { border-bottom: none; }
  .download-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.25rem;
  }
  .download-stats {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-2);
  }

  /* ── Endpoint banner ───────────────────── */
  .endpoint-banner {
    background: var(--green-dim);
    border: 1px solid rgba(61, 214, 140, 0.25);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin-top: 0.75rem;
  }
  .endpoint-banner code {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--green);
    user-select: all;
  }
  .endpoint-banner p {
    font-size: 0.75rem;
    color: var(--text-2);
    margin-top: 0.35rem;
    line-height: 1.5;
  }

  /* ── Params grid ───────────────────────── */
  .params-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .params-grid label {
    display: block;
    font-size: 0.68rem;
    font-family: var(--font-mono);
    color: var(--text-2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  /* ── Responsive ────────────────────────── */
  @media (max-width: 600px) {
    .params-grid { grid-template-columns: 1fr; }
    .info-row { gap: 0.75rem; }
    #root { padding: 1.25rem 1rem; }
  }

  /* ── Scrollbar ─────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-0); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── VRAM estimator ───────────────────────────────────────
// Heuristic regression fitted against measured VRAM use for a range of
// llama.cpp builds + GGUF quants. Magic constants come from that fit
// (see e.g. https://huggingface.co/posts/MaziyarPanahi/284088999786828) —
// expect ±10% error, and revisit when llama.cpp changes its memory layout.
const CACHE_BITS = { f16: 16, bf16: 16, q8_0: 8, q4_0: 4, q4_1: 4, q5_0: 5, q5_1: 5 };

function estimateVram(meta, ngl, ctx, cacheK, cacheV) {
  if (!meta) return null;
  const { n_layers, n_kv_heads, embedding_dim, size_mb } = meta;
  const cache_type = ((CACHE_BITS[cacheK] || 16) + (CACHE_BITS[cacheV] || 16)) / 2;
  const gpu_layers = ngl === -1 ? n_layers : Math.min(Math.max(0, ngl), n_layers);
  const size_per_layer = size_mb / n_layers;
  const kv_cache_factor = n_kv_heads * cache_type * ctx;
  const embedding_per_context = embedding_dim / ctx;
  const vram =
    (size_per_layer - 17.996 + 9.447e-06 * kv_cache_factor)
    * (gpu_layers + Math.max(0.969, cache_type - (Math.floor(50.778 * embedding_per_context) + 9.988)))
    + 1516.523;
  return Math.max(0, vram);
}

// ── API helpers ──────────────────────────────────────────
const api = {
  get: (path) => fetch(path).then(r => r.json()),
  post: (path, body) => fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  }).then(async r => {
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const e = await r.json(); msg = e.detail || JSON.stringify(e); } catch { msg = await r.text() || msg; }
      throw new Error(msg);
    }
    return r.json();
  }),
  del: (path) => fetch(path, { method: "DELETE" }).then(r => r.json()),
};

// ── Hook: fetch once, poll only when active ──────────────
function useFetch(url, intervalMs = 1500) {
  const [data, setData] = useState(null);
  const [polling, setPolling] = useState(false);
  const activeRef = useRef(true);

  const refresh = useCallback(() => {
    return api.get(url).then(d => { if (activeRef.current) setData(d); return d; }).catch(() => null);
  }, [url]);

  // Fetch once on mount
  useEffect(() => {
    activeRef.current = true;
    refresh();
    return () => { activeRef.current = false; };
  }, [refresh]);

  // Conditional polling — only when setPolling(true)
  useEffect(() => {
    if (!polling) return;
    const id = setInterval(refresh, intervalMs);
    return () => clearInterval(id);
  }, [polling, refresh, intervalMs]);

  return { data, refresh, setPolling };
}

// ── Build Section ────────────────────────────────────────
const GCC_FLAG_OPTIONS = [
  { flag: "-march=native", label: "march=native", title: "Optimize for the host CPU instruction set (enables AVX2/AVX512 etc.)" },
  { flag: "-mtune=native", label: "mtune=native", title: "Tune scheduling for the host CPU microarchitecture" },
  { flag: "-O3",           label: "O3",           title: "Aggressive optimization level (may increase compile time)" },
  { flag: "-ffast-math",   label: "fast-math",    title: "Allow approximate floating-point math; improves vectorization" },
  { flag: "-flto",         label: "LTO",          title: "Link Time Optimization: whole-program optimization across translation units" },
];

function BuildSection() {
  const { data: status, refresh, setPolling } = useFetch("/api/build/status");
  const [showLog, setShowLog] = useState(false);
  const [gccFlags, setGccFlags] = useState({ "-march=native": true, "-mtune=native": true });

  // Poll only while building
  useEffect(() => {
    setPolling(status?.status === "building");
  }, [status?.status]);

  if (!status) return null;

  const isBuilding = status.status === "building";
  const dotClass = {
    idle: "dot-idle", building: "dot-spin", success: "dot-ok", failed: "dot-err"
  }[status.status] || "dot-idle";

  const toggleFlag = (flag) => setGccFlags(prev => ({ ...prev, [flag]: !prev[flag] }));

  const handleBuild = () => {
    const selectedFlags = Object.entries(gccFlags).filter(([, on]) => on).map(([f]) => f);
    api.post("/api/build/start", { gcc_flags: selectedFlags })
      .then(() => { setPolling(true); refresh(); })
      .catch(e => alert(e.message));
  };

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${dotClass}`} />
        llama.cpp build engine
      </div>

      <div className="info-row">
        <div className="info-item">
          <label>Status</label>
          <span>{status.status}</span>
        </div>
        {status.commit && (
          <div className="info-item">
            <label>Commit</label>
            <span>{status.commit}</span>
          </div>
        )}
        {status.commit_date && (
          <div className="info-item">
            <label>Date</label>
            <span>{status.commit_date.split(" ")[0]}</span>
          </div>
        )}
        <div className="info-item">
          <label>Binary</label>
          <span>{status.binary_exists ? "✓ ready" : "✗ not built"}</span>
        </div>
      </div>

      <div style={{ marginBottom: "0.85rem" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.68rem", color: "var(--text-2)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "0.45rem" }}>
          GCC Optimization Flags
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem" }}>
          {GCC_FLAG_OPTIONS.map(({ flag, label, title }) => {
            const checked = !!gccFlags[flag];
            return (
              <label key={flag} title={title} style={{
                display: "inline-flex", alignItems: "center", gap: "0.3rem",
                fontFamily: "var(--font-mono)", fontSize: "0.75rem",
                padding: "0.25rem 0.6rem",
                border: `1px solid ${checked ? "var(--accent)" : "var(--border)"}`,
                borderRadius: "4px",
                background: checked ? "var(--accent-glow)" : "var(--bg-2)",
                color: checked ? "var(--accent)" : "var(--text-2)",
                cursor: isBuilding ? "not-allowed" : "pointer",
                opacity: isBuilding ? 0.5 : 1,
                userSelect: "none",
                transition: "all 0.15s ease",
              }}>
                <input type="checkbox" checked={checked} disabled={isBuilding}
                  onChange={() => toggleFlag(flag)}
                  style={{ display: "none" }} />
                {label}
              </label>
            );
          })}
        </div>
      </div>

      {isBuilding && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--text-2)", marginBottom: "0.75rem" }}>
          ▸ {status.progress}
        </div>
      )}

      <div style={{ display: "flex", gap: "0.5rem", alignItems: "center" }}>
        <button className="btn-primary" onClick={handleBuild} disabled={isBuilding}>
          {isBuilding ? "Building…" : status.repo_cloned ? "Pull & Rebuild" : "Clone & Build"}
        </button>
        {status.log && (
          <button className="btn-secondary btn-sm" onClick={() => setShowLog(v => !v)}>
            {showLog ? "Hide Log" : "Show Log"}
          </button>
        )}
      </div>

      {status.error && (
        <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
          Error: {status.error.slice(0, 300)}
        </div>
      )}

      {showLog && status.log && (
        <div className="log-box">{status.log}</div>
      )}
    </div>
  );
}

// ── Download Section ─────────────────────────────────────
function DownloadSection({ refreshModels }) {
  const [url, setUrl] = useState("");
  const [error, setError] = useState("");
  const { data: modelsData, refresh, setPolling } = useFetch("/api/models", 2000);

  const downloads = modelsData ? Object.values(modelsData.downloads).filter(d => d.status === "downloading") : [];

  // Poll only while downloads are active
  useEffect(() => {
    setPolling(downloads.length > 0);
    // When a download finishes, also refresh the model section
    if (modelsData && downloads.length === 0) refreshModels?.();
  }, [downloads.length]);

  const handleDownload = () => {
    setError("");
    if (!url.trim()) return;
    api.post("/api/models/download", { url: url.trim() })
      .then(() => { setUrl(""); setPolling(true); refresh(); })
      .catch(e => setError(e.message));
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter") handleDownload();
  };

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${downloads.length > 0 ? "dot-spin" : "dot-idle"}`} />
        Download GGUF Models
      </div>

      <div style={{ display: "flex", gap: "0.5rem", marginBottom: "0.5rem" }}>
        <input
          type="url"
          placeholder="https://huggingface.co/user/repo/resolve/main/model.gguf"
          value={url}
          onChange={e => setUrl(e.target.value)}
          onKeyDown={handleKeyDown}
          style={{ flex: 1 }}
        />
        <button className="btn-primary" onClick={handleDownload} disabled={downloads.length > 0} style={downloads.length > 0 ? { opacity: 0.45, cursor: "not-allowed", pointerEvents: "none" } : {}}>Download</button>
      </div>

      {error && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.72rem", color: "var(--red)", marginBottom: "0.5rem" }}>
          {error}
        </div>
      )}

      <div style={{ fontSize: "0.72rem", color: "var(--text-2)", marginBottom: "0.5rem" }}>
        Paste a HuggingFace link to any .gguf or .bin file (including mmproj). Supports /resolve/ and /blob/ URLs.
      </div>

      {modelsData?.models_dir && (
        <div style={{ fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", marginBottom: "0.5rem", opacity: 0.7 }}>
          Models directory: {modelsData.models_dir}
        </div>
      )}

      {downloads.map(dl => (
        <div key={dl.filename} className="download-item">
          <div className="download-header">
            <span className="model-name" style={{ fontSize: "0.78rem" }}>{dl.filename}</span>
            <span className="download-stats">{dl.progress}% · {dl.speed}</span>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${dl.progress}%` }} />
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Preset Editor ────────────────────────────────────────
function PresetEditor({ presets, refresh }) {
  const [draft, setDraft] = useState({ name: "", args: "", description: "" });
  const [err, setErr] = useState("");

  const save = (record) => {
    setErr("");
    api.post("/api/presets", record)
      .then(() => refresh())
      .catch(e => setErr(e.message));
  };

  const handleAdd = () => {
    if (!draft.name.trim()) { setErr("Name is required"); return; }
    api.post("/api/presets", draft)
      .then(() => { setDraft({ name: "", args: "", description: "" }); refresh(); })
      .catch(e => setErr(e.message));
  };

  const handleDelete = (id) => {
    api.del(`/api/presets/${encodeURIComponent(id)}`).then(refresh);
  };

  const inputStyle = { fontFamily: "var(--font-mono)", fontSize: "0.72rem", padding: "0.35rem 0.5rem" };

  return (
    <div style={{ marginTop: "0.75rem", padding: "0.75rem", background: "var(--bg-2)", border: "1px solid var(--border)", borderRadius: "6px" }}>
      {presets.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "1.2fr 2fr 1.5fr auto", gap: "0.4rem 0.5rem", marginBottom: "0.6rem", alignItems: "center" }}>
          <div style={{ fontSize: "0.62rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase" }}>Name</div>
          <div style={{ fontSize: "0.62rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase" }}>Args</div>
          <div style={{ fontSize: "0.62rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase" }}>Description</div>
          <div />
          {presets.map(p => (
            <PresetRow key={p.id} preset={p} onSave={save} onDelete={() => handleDelete(p.id)} inputStyle={inputStyle} />
          ))}
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "1.2fr 2fr 1.5fr auto", gap: "0.4rem 0.5rem", alignItems: "center" }}>
        <input style={inputStyle} placeholder="My preset"
          value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} />
        <input style={inputStyle} placeholder="--flag value --other-flag"
          value={draft.args} onChange={e => setDraft({ ...draft, args: e.target.value })} />
        <input style={inputStyle} placeholder="optional notes"
          value={draft.description} onChange={e => setDraft({ ...draft, description: e.target.value })} />
        <button className="btn-primary btn-sm" onClick={handleAdd}>Add</button>
      </div>
      {err && (
        <div style={{ marginTop: "0.5rem", fontFamily: "var(--font-mono)", fontSize: "0.7rem", color: "var(--red)" }}>{err}</div>
      )}
    </div>
  );
}

function PresetRow({ preset, onSave, onDelete, inputStyle }) {
  const [name, setName] = useState(preset.name);
  const [args, setArgs] = useState(preset.args);
  const [description, setDescription] = useState(preset.description || "");
  const dirty = name !== preset.name || args !== preset.args || description !== (preset.description || "");

  useEffect(() => {
    setName(preset.name); setArgs(preset.args); setDescription(preset.description || "");
  }, [preset.id, preset.name, preset.args, preset.description]);

  return (
    <>
      <input style={inputStyle} value={name} onChange={e => setName(e.target.value)} />
      <input style={inputStyle} value={args} onChange={e => setArgs(e.target.value)} />
      <input style={inputStyle} value={description} onChange={e => setDescription(e.target.value)} />
      <div style={{ display: "flex", gap: "0.25rem" }}>
        <button className="btn-secondary btn-sm" disabled={!dirty}
          style={!dirty ? { opacity: 0.4, cursor: "not-allowed" } : {}}
          onClick={() => onSave({ id: preset.id, name, args, description })}>Save</button>
        <button className="btn-danger btn-sm" onClick={onDelete}>×</button>
      </div>
    </>
  );
}

// ── Model List / Load Section ────────────────────────────
function ModelSection({ modelsRef }) {
  const { data: modelsData, refresh: refreshModels } = useFetch("/api/models");
  const { data: serverStatus, refresh: refreshServer, setPolling } = useFetch("/api/server/status");

  useEffect(() => { if (modelsRef) modelsRef.current = refreshModels; }, [refreshModels]);

  const [selected, setSelected] = useState("");
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [showLog, setShowLog] = useState(false);
  const [showCmd, setShowCmd] = useState(false);

  // Basic params
  const [ngl, setNgl] = useState(-1);
  const [ctx, setCtx] = useState(32768);
  const [npar, setNpar] = useState(1);
  const [port, setPort] = useState(5000);

  // Advanced / MoE params
  const [flashAttn, setFlashAttn] = useState("auto");
  const [batch, setBatch] = useState(2048);
  const [ubatch, setUbatch] = useState(512);
  const [cpuMoe, setCpuMoe] = useState(false);
  const [nCpuMoe, setNCpuMoe] = useState(0);
  const [cacheK, setCacheK] = useState("f16");
  const [cacheV, setCacheV] = useState("f16");
  const [tensorSplit, setTensorSplit] = useState("");
  const [overrideTensor, setOverrideTensor] = useState("");
  const [extraArgs, setExtraArgs] = useState("");
  const [mmproj, setMmproj] = useState("");
  const [draftModel, setDraftModel] = useState("");
  const [draftNgl, setDraftNgl] = useState(-1);
  const [draftMax, setDraftMax] = useState(3);
  const [draftPMin, setDraftPMin] = useState(0.0);
  const [showPresetMgr, setShowPresetMgr] = useState(false);
  // IDs of presets the user has toggled "on". Their args are resolved by the
  // backend at launch time, so we only need to track the IDs in the UI.
  const [activePresetIds, setActivePresetIds] = useState([]);
  const { data: presetsData, refresh: refreshPresets } = useFetch("/api/presets");
  const allPresets = presetsData?.presets || [];

  const models = modelsData?.models || [];
  const mainModels = models.filter(m => !m.is_mmproj);
  const isRunning = serverStatus?.status === "running" || serverStatus?.status === "starting";
  const selectedModel = mainModels.find(m => m.filename === selected);

  useEffect(() => {
    setPolling(serverStatus?.status === "starting" || showLog);
  }, [serverStatus?.status, showLog]);

  const applySettings = (s) => {
    const d = s || {};
    setNgl(d.n_gpu_layers ?? -1);
    setCtx(d.ctx_size ?? 32768);
    setNpar(d.n_parallel ?? 1);
    setPort(d.port ?? 5000);
    setFlashAttn(d.flash_attn ?? "auto");
    setBatch(d.batch_size ?? 2048);
    setUbatch(d.ubatch_size ?? 512);
    setCpuMoe(d.cpu_moe ?? false);
    setNCpuMoe(d.n_cpu_moe ?? 0);
    setCacheK(d.cache_type_k ?? "f16");
    setCacheV(d.cache_type_v ?? "f16");
    setTensorSplit(d.tensor_split ?? "");
    setOverrideTensor(d.override_tensor ?? "");
    setExtraArgs(d.extra_args ?? "");
    setMmproj(d.mmproj ?? "");
    setDraftModel(d.draft_model_path ?? "");
    setDraftNgl(d.draft_gpu_layers ?? -1);
    setDraftMax(d.draft_max ?? 3);
    setDraftPMin(d.draft_p_min ?? 0.0);
    setActivePresetIds(Array.isArray(d.active_preset_ids) ? d.active_preset_ids : []);
  };

  const togglePreset = (preset) => {
    const fragment = (preset.args || "").trim();
    const isActive = activePresetIds.includes(preset.id);
    if (isActive) {
      setActivePresetIds(prev => prev.filter(id => id !== preset.id));
      if (fragment) {
        // Strip the first exact occurrence along with any surrounding spaces,
        // then collapse the result. If the user has edited the text such that
        // the fragment is no longer present, leave the text alone — flipping
        // the highlight off is enough.
        setExtraArgs(prev => {
          const idx = prev.indexOf(fragment);
          if (idx < 0) return prev;
          const before = prev.slice(0, idx).replace(/\s+$/, "");
          const after = prev.slice(idx + fragment.length).replace(/^\s+/, "");
          return before && after ? `${before} ${after}` : before + after;
        });
      }
    } else {
      setActivePresetIds(prev => [...prev, preset.id]);
      if (fragment) {
        setExtraArgs(prev => prev.trim() ? `${prev.trim()} ${fragment}` : fragment);
      }
    }
  };

  const initRef = useRef(false);
  useEffect(() => {
    if (initRef.current || mainModels.length === 0) return;
    const preferred = mainModels.find(m => m.settings) || mainModels[0];
    setSelected(preferred.filename);
    applySettings(preferred.settings);
    initRef.current = true;
  }, [mainModels.length]);

  // Drop a draft selection that has become unresolvable — file deleted, or
  // the same model was just picked as main. Without this, the UI dropdown
  // visually shows "None" but the stale path stays in React state and gets
  // POSTed at load time.
  useEffect(() => {
    if (!modelsData || !draftModel) return;
    const valid = models.some(m =>
      !m.is_mmproj && m.path === draftModel && m.path !== selectedModel?.path);
    if (!valid) setDraftModel("");
  }, [draftModel, modelsData, selectedModel?.path]);

  const handleSelect = (filename) => {
    setSelected(filename);
    const model = mainModels.find(m => m.filename === filename);
    // Apply the model's saved settings if it has any; otherwise reset every
    // field to its default. applySettings(undefined) resets because each field
    // falls back to its default via `??`. Without this, picking a brand new
    // model would leave the previously selected model's config in the form.
    applySettings(model?.settings);
  };

  const handleLoad = () => {
    if (!selectedModel) return;
    api.post("/api/server/start", {
      model_path: selectedModel.path,
      port, n_gpu_layers: ngl, ctx_size: ctx, n_parallel: npar,
      mmproj,
      flash_attn: flashAttn, batch_size: batch, ubatch_size: ubatch,
      cpu_moe: cpuMoe, n_cpu_moe: nCpuMoe,
      cache_type_k: cacheK, cache_type_v: cacheV,
      tensor_split: tensorSplit, override_tensor: overrideTensor,
      extra_args: extraArgs,
      active_preset_ids: activePresetIds,
      draft_model_path: draftModel,
      draft_gpu_layers: draftNgl,
      draft_max: draftMax,
      draft_p_min: draftPMin,
    }).then(() => { setPolling(true); refreshServer(); })
      .catch(e => alert(e.message));
  };

  const handleStop = () => {
    api.post("/api/server/stop").then(refreshServer).catch(e => alert(e.message));
  };

  const handleDelete = () => {
    if (!selectedModel) return;
    if (confirm(`Delete ${selectedModel.filename}?`)) {
      api.del(`/api/models/${selectedModel.filename}`).then(() => {
        refreshModels();
        setSelected(mainModels.length > 1 ? mainModels.find(m => m.filename !== selectedModel.filename)?.filename || "" : "");
      });
    }
  };

  const dotClass = {
    stopped: "dot-idle", starting: "dot-spin", running: "dot-ok", error: "dot-err"
  }[serverStatus?.status] || "dot-idle";

  const kvTypes = ["f16", "bf16", "q8_0", "q4_0", "q4_1", "q5_0", "q5_1"];

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${dotClass}`} />
        Inference Server
        {serverStatus?.status === "running" && (
          <span style={{ marginLeft: "auto", fontSize: "0.68rem", color: "var(--green)", fontFamily: "var(--font-mono)" }}>
            ● LIVE
          </span>
        )}
      </div>

      {!isRunning && (
        <>
          <div style={{ marginBottom: "1rem" }}>
            <label style={{ display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" }}>
              Model
            </label>
            {mainModels.length === 0 ? (
              <div style={{ fontSize: "0.82rem", color: "var(--text-2)", padding: "0.5rem 0" }}>
                No models yet. Download one above.
              </div>
            ) : (
              <select value={selected} onChange={e => handleSelect(e.target.value)}>
                {mainModels.map(m => (
                  <option key={m.filename} value={m.filename}>
                    {m.filename}  ({m.size_human}){m.settings ? " \u2605" : ""}
                  </option>
                ))}
              </select>
            )}
          </div>

          {/* mmproj selector — shown only when mmproj files exist */}
          {models.some(m => m.is_mmproj) && (
            <div style={{ marginBottom: "1rem" }}>
              <label style={{ display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" }}>
                Vision Projector (mmproj)
              </label>
              <select value={mmproj} onChange={e => setMmproj(e.target.value)}>
                <option value="">None (text-only)</option>
                {models.filter(m => m.is_mmproj).map(m => (
                  <option key={m.filename} value={m.path}>
                    {m.filename}  ({m.size_human})
                  </option>
                ))}
              </select>
            </div>
          )}

          {/* Draft model selector for speculative decoding */}
          <div style={{ marginBottom: "1rem" }}>
            <label style={{ display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" }}>
              Draft Model (MTP speculative decoding)
            </label>
            <select value={draftModel} onChange={e => setDraftModel(e.target.value)}>
              <option value="">None (no speculative decoding)</option>
              {models.filter(m => !m.is_mmproj && m.path !== selectedModel?.path).map(m => (
                <option key={m.filename} value={m.path}>
                  {m.filename}  ({m.size_human})
                </option>
              ))}
            </select>
          </div>

          <div className="params-grid">
            <div>
              <label>GPU Layers (-1=all)</label>
              <input type="number" value={ngl} onChange={e => setNgl(+e.target.value)} />
            </div>
            <div>
              <label>Context Size</label>
              <input type="number" value={ctx} onChange={e => setCtx(+e.target.value)} />
            </div>
            <div>
              <label>Parallel Slots</label>
              <input type="number" value={npar} onChange={e => setNpar(+e.target.value)} min={1} />
            </div>
            <div>
              <label>Port</label>
              <input type="number" value={port} onChange={e => setPort(+e.target.value)} />
            </div>
          </div>

          <div
            onClick={() => setShowAdvanced(v => !v)}
            style={{ cursor: "pointer", fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", marginBottom: showAdvanced ? "0.75rem" : "1rem", userSelect: "none", letterSpacing: "0.05em" }}
          >
            {showAdvanced ? "\u25BE" : "\u25B8"} ADVANCED
          </div>

          {showAdvanced && (
            <>
              <div className="params-grid">
                <div>
                  <label>Flash Attention</label>
                  <select value={flashAttn} onChange={e => setFlashAttn(e.target.value)}>
                    <option value="auto">auto</option>
                    <option value="on">on</option>
                    <option value="off">off</option>
                  </select>
                </div>
                <div>
                  <label>Batch Size (-b)</label>
                  <input type="number" value={batch} onChange={e => setBatch(+e.target.value)} />
                </div>
                <div>
                  <label>Micro Batch (-ub)</label>
                  <input type="number" value={ubatch} onChange={e => setUbatch(+e.target.value)} />
                </div>
              </div>

              <div className="params-grid">
                <div>
                  <label>KV Cache K Type</label>
                  <select value={cacheK} onChange={e => setCacheK(e.target.value)}>
                    {kvTypes.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label>KV Cache V Type</label>
                  <select value={cacheV} onChange={e => setCacheV(e.target.value)}>
                    {kvTypes.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", alignItems: "end", gap: "0.5rem", paddingBottom: "0.15rem" }}>
                  <label style={{ display: "flex", alignItems: "center", gap: "0.4rem", cursor: "pointer", whiteSpace: "nowrap" }}>
                    <input type="checkbox" checked={cpuMoe} onChange={e => setCpuMoe(e.target.checked)}
                      style={{ width: "auto", accentColor: "var(--accent)" }} />
                    <span style={{ fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-1)" }}>ALL experts → CPU</span>
                  </label>
                </div>
              </div>

              {!cpuMoe && (
                <div className="params-grid" style={{ gridTemplateColumns: "1fr 2fr" }}>
                  <div>
                    <label>N CPU MoE Layers</label>
                    <input type="number" value={nCpuMoe} onChange={e => setNCpuMoe(+e.target.value)} min={0}
                      title="Keep MoE weights of the first N layers on CPU (0 = disabled)" />
                  </div>
                  <div>
                    <label>Tensor Split (multi-GPU, e.g. 3,1)</label>
                    <input type="text" value={tensorSplit} onChange={e => setTensorSplit(e.target.value)}
                      placeholder="e.g. 3,1 for 75%/25% split" />
                  </div>
                </div>
              )}

              <div style={{ marginBottom: "1rem" }}>
                <label style={{ display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" }}>
                  Override Tensor (-ot, regex placement)
                </label>
                <input type="text" value={overrideTensor} onChange={e => setOverrideTensor(e.target.value)}
                  placeholder='e.g. blk\.([0-9])\.=CUDA0,exps=CPU' />
              </div>

              <div style={{ marginBottom: "1rem" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "0.35rem" }}>
                  <label style={{ fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase" }}>
                    Presets (global, appended to extra args)
                  </label>
                  <span onClick={() => setShowPresetMgr(v => !v)}
                    style={{ cursor: "pointer", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", userSelect: "none" }}>
                    {showPresetMgr ? "▾ Done" : "▸ Manage"}
                  </span>
                </div>
                {allPresets.length === 0 ? (
                  <div style={{ fontSize: "0.72rem", color: "var(--text-2)" }}>
                    No presets yet. Click <b>Manage</b> to add one.
                  </div>
                ) : (
                  <>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem" }}>
                      {allPresets.map(p => {
                        const active = activePresetIds.includes(p.id);
                        return (
                          <button key={p.id} type="button" onClick={() => togglePreset(p)}
                            title={p.description ? `${p.description}\n\n${p.args}` : p.args}
                            aria-pressed={active}
                            style={{
                              fontFamily: "var(--font-mono)", fontSize: "0.72rem",
                              padding: "0.25rem 0.6rem",
                              border: `1px solid ${active ? "var(--accent)" : "var(--border)"}`,
                              borderRadius: "4px",
                              background: active ? "var(--accent-glow)" : "var(--bg-2)",
                              color: active ? "var(--accent)" : "var(--text-1)",
                              cursor: "pointer",
                              userSelect: "none",
                              transition: "all 0.15s ease",
                            }}>
                            {p.name}
                          </button>
                        );
                      })}
                    </div>
                    <div style={{ fontSize: "0.65rem", color: "var(--text-2)", marginTop: "0.4rem" }}>
                      Click to toggle. Active presets stay highlighted and their args are merged into Extra Args.
                    </div>
                  </>
                )}
                {showPresetMgr && (
                  <PresetEditor presets={allPresets} refresh={refreshPresets} />
                )}
              </div>

              <div style={{ marginBottom: "1rem" }}>
                <label style={{ display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" }}>
                  Extra Command Line Arguments
                </label>
                <input type="text" value={extraArgs} onChange={e => setExtraArgs(e.target.value)}
                  placeholder={"e.g. --chat-template-kwargs '{\"enable_thinking\": false}'"} />
                <div style={{ fontSize: "0.65rem", color: "var(--text-2)", marginTop: "0.25rem" }}>
                  Additional arguments passed directly to llama-server. Use shell‑quoting rules.
                </div>
              </div>

              {/* Speculative decoding draft model params */}
              {draftModel && (
                <>
                  <div style={{ borderTop: "1px solid var(--border)", margin: "1rem 0 0.75rem", paddingTop: "0.75rem" }}>
                    <label style={{ fontSize: "0.7rem", fontFamily: "var(--font-mono)", color: "var(--accent)", textTransform: "uppercase", letterSpacing: "0.05em", display: "block", marginBottom: "0.75rem" }}>
                      Draft Model Settings
                    </label>
                    <div className="params-grid">
                      <div>
                        <label>Draft GPU Layers</label>
                        <input type="number" value={draftNgl} onChange={e => setDraftNgl(+e.target.value)}
                          title="GPU layers for draft model (-ngld). -1 = all layers." />
                      </div>
                      <div>
                        <label>Draft Max Tokens</label>
                        <input type="number" value={draftMax} onChange={e => setDraftMax(+e.target.value)} min={1} max={16}
                          title="Maximum number of tokens the draft model predicts per step (--draft-max)." />
                      </div>
                      <div>
                        <label>Draft P-Min</label>
                        <input type="number" value={draftPMin} onChange={e => setDraftPMin(+e.target.value)}
                          step="0.01" min={0} max={1}
                          title="Minimum probability threshold for accepting draft tokens (--draft-p-min). 0.0 = greedy." />
                      </div>
                    </div>
                  </div>
                </>
              )}
            </>
          )}

          {(() => {
            const vramMain = estimateVram(selectedModel?.meta, ngl, ctx, cacheK, cacheV);
            if (vramMain == null) return null;
            const draftMeta = draftModel ? models.find(m => m.path === draftModel)?.meta : null;
            const vramDraft = estimateVram(draftMeta, draftNgl, ctx, cacheK, cacheV) || 0;
            const vram = vramMain + vramDraft;
            return (
              <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.72rem", color: "var(--text-2)", marginBottom: "0.75rem" }}>
                Estimated Memory Usage: <span style={{ color: "var(--accent)" }}>{(vram / 1024).toFixed(1)} GB</span>
              </div>
            );
          })()}

          <div style={{ display: "flex", gap: "0.5rem" }}>
            <button className="btn-primary" onClick={handleLoad} disabled={!selectedModel}>
              Load Model
            </button>
            {selectedModel && (
              <button className="btn-danger btn-sm" onClick={handleDelete}>
                Delete
              </button>
            )}
          </div>
        </>
      )}

      {isRunning && serverStatus && (
        <>
          <div className="info-row">
            <div className="info-item">
              <label>Status</label>
              <span>{serverStatus.status}</span>
            </div>
            <div className="info-item">
              <label>Model</label>
              <span>{serverStatus.model}</span>
            </div>
            <div className="info-item">
              <label>Port</label>
              <span>{serverStatus.port}</span>
            </div>
            <div className="info-item">
              <label>PID</label>
              <span>{serverStatus.pid}</span>
            </div>
          </div>

          <div style={{ display: "flex", gap: "0.5rem", alignItems: "center", flexWrap: "wrap" }}>
            <button className="btn-danger" onClick={handleStop}>
              Stop Server
            </button>
            <button className="btn-secondary btn-sm" onClick={() => { setShowLog(v => !v); if (!showLog) { setPolling(true); } }}>
              {showLog ? "Hide Log" : "Show Log"}
            </button>
            <button className="btn-secondary btn-sm" onClick={() => setShowCmd(v => !v)}>
              {showCmd ? "Hide Cmd" : "Show Cmd"}
            </button>
          </div>

          {serverStatus.status === "running" && (
            <div className="endpoint-banner">
              <code>http://localhost:{serverStatus.port}/v1/chat/completions</code>
              <p>
                OpenAI-compatible endpoint ready.
                Use with any client &mdash; <code>base_url=http://localhost:{serverStatus.port}/v1</code>
              </p>
            </div>
          )}

          {serverStatus.status === "starting" && (
            <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--accent)" }}>
              Loading model into memory&hellip;
            </div>
          )}

          {serverStatus.error && (
            <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
              Error: {serverStatus.error}
            </div>
          )}

          {showCmd && serverStatus.cmd && (
            <div className="log-box" style={{ marginTop: "0.75rem", maxHeight: "80px" }}>
              {serverStatus.cmd}
            </div>
          )}

          {showLog && (
            <div className="log-box" style={{ marginTop: "0.75rem", maxHeight: "300px" }}>
              {serverStatus.log || "(no output yet)"}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── tabbyAPI Install Section ─────────────────────────────
function TabbyBuildSection() {
  const { data: status, refresh, setPolling } = useFetch("/api/tabby/build/status");
  const [showLog, setShowLog] = useState(false);

  // Poll only while installing
  useEffect(() => {
    setPolling(status?.status === "installing");
  }, [status?.status]);

  if (!status) return null;

  const isInstalling = status.status === "installing";
  const dotClass = {
    idle: "dot-idle", installing: "dot-spin", success: "dot-ok", failed: "dot-err"
  }[status.status] || "dot-idle";

  const handleInstall = () => {
    api.post("/api/tabby/build/start")
      .then(() => { setPolling(true); refresh(); })
      .catch(e => alert(e.message));
  };

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${dotClass}`} />
        tabbyAPI engine (exllamav3)
      </div>

      <div className="info-row">
        <div className="info-item">
          <label>Status</label>
          <span>{status.status}</span>
        </div>
        <div className="info-item">
          <label>Installed</label>
          <span>{status.installed ? "✓ ready" : "✗ not installed"}</span>
        </div>
      </div>

      <div style={{ fontSize: "0.72rem", color: "var(--text-2)", marginBottom: "0.75rem" }}>
        Clones tabbyAPI into the data directory and installs it into its own venv
        (torch + exllamav3). First install downloads several GB of wheels.
      </div>

      {isInstalling && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--text-2)", marginBottom: "0.75rem" }}>
          ▸ {status.progress}
        </div>
      )}

      <div style={{ display: "flex", gap: "0.5rem", alignItems: "center" }}>
        <button className="btn-primary" onClick={handleInstall} disabled={isInstalling}>
          {isInstalling ? "Installing…" : status.installed ? "Update" : status.repo_cloned ? "Resume Install" : "Install tabbyAPI"}
        </button>
        {status.log && (
          <button className="btn-secondary btn-sm" onClick={() => setShowLog(v => !v)}>
            {showLog ? "Hide Log" : "Show Log"}
          </button>
        )}
      </div>

      {status.error && (
        <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
          Error: {status.error.slice(0, 300)}
        </div>
      )}

      {showLog && status.log && (
        <div className="log-box">{status.log}</div>
      )}
    </div>
  );
}

// ── tabbyAPI Download Section ────────────────────────────
function TabbyDownloadSection({ refreshModels }) {
  const [repoId, setRepoId] = useState("");
  const [revision, setRevision] = useState("");
  const [error, setError] = useState("");
  const { data: modelsData, refresh, setPolling } = useFetch("/api/tabby/models", 2000);

  const downloads = modelsData ? Object.values(modelsData.downloads).filter(d => d.status === "downloading") : [];
  const failed = modelsData ? Object.values(modelsData.downloads).filter(d => d.status === "failed") : [];

  // Poll only while downloads are active
  useEffect(() => {
    setPolling(downloads.length > 0);
    // When a download finishes, also refresh the model section
    if (modelsData && downloads.length === 0) refreshModels?.();
  }, [downloads.length]);

  const handleDownload = () => {
    setError("");
    if (!repoId.trim()) return;
    api.post("/api/tabby/models/download", { repo_id: repoId.trim(), revision: revision.trim() })
      .then(() => { setRepoId(""); setRevision(""); setPolling(true); refresh(); })
      .catch(e => setError(e.message));
  };

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${downloads.length > 0 ? "dot-spin" : "dot-idle"}`} />
        Download EXL3 Models
      </div>

      <div style={{ display: "flex", gap: "0.5rem", marginBottom: "0.5rem" }}>
        <input
          type="text"
          placeholder="turboderp/Llama-3.2-1B-exl3"
          value={repoId}
          onChange={e => setRepoId(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") handleDownload(); }}
          style={{ flex: 1 }}
        />
        <input
          type="text"
          placeholder="revision, e.g. 6.0bpw"
          value={revision}
          onChange={e => setRevision(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") handleDownload(); }}
          style={{ width: "160px" }}
          title="Branch/tag to download. exl3 repos usually keep each quant in its own branch; main often has no weights."
        />
        <button className="btn-primary" onClick={handleDownload} disabled={downloads.length > 0} style={downloads.length > 0 ? { opacity: 0.45, cursor: "not-allowed", pointerEvents: "none" } : {}}>Download</button>
      </div>

      {error && (
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.72rem", color: "var(--red)", marginBottom: "0.5rem" }}>
          {error}
        </div>
      )}

      <div style={{ fontSize: "0.72rem", color: "var(--text-2)", marginBottom: "0.5rem" }}>
        Enter a HuggingFace repo id of an exl3-quantized model (the whole repo is downloaded).
        exl3 quants usually live in <b>branches</b> (check the repo's revisions, e.g. <code>6.0bpw</code>) — main often holds no weights.
        Requires tabbyAPI to be running — downloads go through its API.
      </div>

      {modelsData?.models_dir && (
        <div style={{ fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", marginBottom: "0.5rem", opacity: 0.7 }}>
          Models directory: {modelsData.models_dir}
        </div>
      )}

      {downloads.map(dl => (
        <div key={dl.repo_id} className="download-item">
          <div className="download-header">
            <span className="model-name" style={{ fontSize: "0.78rem" }}>{dl.repo_id}</span>
            <span className="download-stats">downloading… (no progress info)</span>
          </div>
        </div>
      ))}
      {failed.map(dl => (
        <div key={dl.repo_id} className="download-item">
          <div className="download-header">
            <span className="model-name" style={{ fontSize: "0.78rem" }}>{dl.repo_id}</span>
            <span className="download-stats" style={{ color: "var(--red)" }}>failed: {(dl.error || "").slice(0, 120)}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── tabbyAPI Server / Model Section ──────────────────────
function TabbyServerSection({ modelsRef }) {
  const { data: modelsData, refresh: refreshModels } = useFetch("/api/tabby/models");
  const { data: status, refresh: refreshStatus, setPolling } = useFetch("/api/tabby/server/status");

  useEffect(() => { if (modelsRef) modelsRef.current = refreshModels; }, [refreshModels]);

  const [selected, setSelected] = useState("");
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [showLog, setShowLog] = useState(false);

  // Process params
  const [port, setPort] = useState(5001);
  const [bindHost, setBindHost] = useState("127.0.0.1");

  // Model load params (0 / "" = tabby default)
  const [maxSeqLen, setMaxSeqLen] = useState(0);
  const [cacheSize, setCacheSize] = useState(0);
  const [cacheMode, setCacheMode] = useState("");
  const [gpuSplitAuto, setGpuSplitAuto] = useState(true);
  const [gpuSplit, setGpuSplit] = useState("");
  const [tensorParallel, setTensorParallel] = useState(false);
  const [chunkSize, setChunkSize] = useState(0);
  const [ropeScale, setRopeScale] = useState(0);
  const [promptTemplate, setPromptTemplate] = useState("");
  const [vision, setVision] = useState(false);
  const [draftModel, setDraftModel] = useState("");

  const models = (modelsData?.models || []).filter(m => m.valid);
  const procStatus = status?.status;
  const model = status?.model || {};
  const isUp = procStatus === "running" || procStatus === "starting";

  useEffect(() => {
    setPolling(procStatus === "starting" || model.status === "loading" || showLog);
  }, [procStatus, model.status, showLog]);

  const applySettings = (s) => {
    const d = s || {};
    setMaxSeqLen(d.max_seq_len ?? 0);
    setCacheSize(d.cache_size ?? 0);
    setCacheMode(d.cache_mode ?? "");
    setGpuSplitAuto(d.gpu_split_auto ?? true);
    setGpuSplit(d.gpu_split ?? "");
    setTensorParallel(d.tensor_parallel ?? false);
    setChunkSize(d.chunk_size ?? 0);
    setRopeScale(d.rope_scale ?? 0);
    setPromptTemplate(d.prompt_template ?? "");
    setVision(d.vision ?? false);
    setDraftModel(d.draft_mode === "mtp" ? "__mtp__" : (d.draft_model_name ?? ""));
  };

  const initRef = useRef(false);
  useEffect(() => {
    if (initRef.current || models.length === 0) return;
    const preferred = models.find(m => m.settings) || models[0];
    setSelected(preferred.name);
    applySettings(preferred.settings);
    initRef.current = true;
  }, [models.length]);

  const selectedModel = models.find(m => m.name === selected);

  const handleSelect = (name) => {
    setSelected(name);
    // Saved settings if any, otherwise reset every field to its default
    applySettings(models.find(m => m.name === name)?.settings);
  };

  const handleStartServer = () => {
    api.post("/api/tabby/server/start", { port, bind_host: bindHost })
      .then(() => { setPolling(true); refreshStatus(); })
      .catch(e => alert(e.message));
  };

  const handleStopServer = () => {
    api.post("/api/tabby/server/stop").then(refreshStatus).catch(e => alert(e.message));
  };

  const handleLoad = () => {
    if (!selectedModel) return;
    api.post("/api/tabby/server/load", {
      model_name: selectedModel.name,
      max_seq_len: maxSeqLen, cache_size: cacheSize, cache_mode: cacheMode,
      gpu_split_auto: gpuSplitAuto, gpu_split: gpuSplit,
      tensor_parallel: tensorParallel, chunk_size: chunkSize, rope_scale: ropeScale,
      prompt_template: promptTemplate, vision,
      draft_model_name: draftModel === "__mtp__" ? "" : draftModel,
      draft_mode: draftModel === "__mtp__" ? "mtp" : "",
    }).then(() => { setPolling(true); refreshStatus(); })
      .catch(e => alert(e.message));
  };

  const handleUnload = () => {
    api.post("/api/tabby/server/unload").then(refreshStatus).catch(e => alert(e.message));
  };

  const handleDelete = () => {
    if (!selectedModel) return;
    if (confirm(`Delete ${selectedModel.name}?`)) {
      api.del(`/api/tabby/models/${encodeURIComponent(selectedModel.name)}`).then(res => {
        if (res.detail) { alert(res.detail); return; }
        refreshModels();
        setSelected(models.length > 1 ? models.find(m => m.name !== selectedModel.name)?.name || "" : "");
      });
    }
  };

  const dotClass = model.status === "loaded" ? "dot-ok" : {
    stopped: "dot-idle", starting: "dot-spin", running: "dot-warn", error: "dot-err"
  }[procStatus] || "dot-idle";

  const labelStyle = { display: "block", fontSize: "0.68rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: "0.25rem" };

  return (
    <div className="card">
      <div className="card-title">
        <span className={`dot ${dotClass}`} />
        tabbyAPI Inference Server
        {model.status === "loaded" && (
          <span style={{ marginLeft: "auto", fontSize: "0.68rem", color: "var(--green)", fontFamily: "var(--font-mono)" }}>
            ● LIVE
          </span>
        )}
      </div>

      {!isUp && (
        <>
          <div className="params-grid" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <div>
              <label>Port</label>
              <input type="number" value={port} onChange={e => setPort(+e.target.value)} />
            </div>
            <div>
              <label>Bind Host</label>
              <input type="text" value={bindHost} onChange={e => setBindHost(e.target.value)}
                title='Use "0.0.0.0" to expose the inference port to the LAN (auth stays enabled).' />
            </div>
          </div>
          <button className="btn-primary" onClick={handleStartServer}>
            Start tabbyAPI
          </button>
          {procStatus === "error" && status?.error && (
            <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
              Error: {status.error}
            </div>
          )}
        </>
      )}

      {isUp && (
        <>
          <div className="info-row">
            <div className="info-item">
              <label>Status</label>
              <span>{procStatus}{model.status !== "none" ? ` · model ${model.status}` : ""}</span>
            </div>
            <div className="info-item">
              <label>Port</label>
              <span>{status.port}</span>
            </div>
            <div className="info-item">
              <label>PID</label>
              <span>{status.pid}</span>
            </div>
            {model.name && (
              <div className="info-item">
                <label>Model</label>
                <span>{model.name}</span>
              </div>
            )}
          </div>

          {procStatus === "running" && model.status !== "loaded" && model.status !== "loading" && (
            <>
              <div style={{ marginBottom: "1rem" }}>
                <label style={labelStyle}>Model</label>
                {models.length === 0 ? (
                  <div style={{ fontSize: "0.82rem", color: "var(--text-2)", padding: "0.5rem 0" }}>
                    No exl3 models yet. Download one above.
                  </div>
                ) : (
                  <select value={selected} onChange={e => handleSelect(e.target.value)}>
                    {models.map(m => (
                      <option key={m.name} value={m.name}>
                        {m.name}  ({m.size_human}){m.settings ? " ★" : ""}
                      </option>
                    ))}
                  </select>
                )}
              </div>

              <div style={{ marginBottom: "1rem" }}>
                <label style={labelStyle}>Draft Model (speculative decoding)</label>
                <select value={draftModel} onChange={e => setDraftModel(e.target.value)}>
                  <option value="">None (no speculative decoding)</option>
                  <option value="__mtp__">MTP — model's own draft weights (Qwen3.5+, Gemma 4)</option>
                  {models.filter(m => m.name !== selected).map(m => (
                    <option key={m.name} value={m.name}>
                      {m.name}  ({m.size_human})
                    </option>
                  ))}
                </select>
              </div>

              <div className="params-grid">
                <div>
                  <label>Max Seq Len (0=auto)</label>
                  <input type="number" value={maxSeqLen} onChange={e => setMaxSeqLen(+e.target.value)} />
                </div>
                <div>
                  <label>Cache Size (0=default)</label>
                  <input type="number" value={cacheSize} onChange={e => setCacheSize(+e.target.value)}
                    title="KV cache size in tokens; must be a multiple of 256." />
                </div>
                <div>
                  <label>Cache Mode</label>
                  <input type="text" value={cacheMode} onChange={e => setCacheMode(e.target.value)}
                    placeholder="6,6 (k,v bits) or FP16"
                    title="exl3: quantized cache as k_bits,v_bits (2-8), e.g. 6,6. Empty = FP16." />
                </div>
              </div>

              <div
                onClick={() => setShowAdvanced(v => !v)}
                style={{ cursor: "pointer", fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-2)", marginBottom: showAdvanced ? "0.75rem" : "1rem", userSelect: "none", letterSpacing: "0.05em" }}
              >
                {showAdvanced ? "▾" : "▸"} ADVANCED
              </div>

              {showAdvanced && (
                <>
                  <div className="params-grid">
                    <div>
                      <label>GPU Split (GB, e.g. 12,24)</label>
                      <input type="text" value={gpuSplit} onChange={e => setGpuSplit(e.target.value)}
                        placeholder="empty = auto split" />
                    </div>
                    <div style={{ display: "flex", alignItems: "end", gap: "0.5rem", paddingBottom: "0.15rem" }}>
                      <label style={{ display: "flex", alignItems: "center", gap: "0.4rem", cursor: "pointer", whiteSpace: "nowrap" }}>
                        <input type="checkbox" checked={gpuSplitAuto} onChange={e => setGpuSplitAuto(e.target.checked)}
                          disabled={!!gpuSplit.trim()}
                          style={{ width: "auto", accentColor: "var(--accent)" }} />
                        <span style={{ fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-1)" }}>GPU split auto</span>
                      </label>
                    </div>
                    <div style={{ display: "flex", alignItems: "end", gap: "0.5rem", paddingBottom: "0.15rem" }}>
                      <label style={{ display: "flex", alignItems: "center", gap: "0.4rem", cursor: "pointer", whiteSpace: "nowrap" }}>
                        <input type="checkbox" checked={tensorParallel} onChange={e => setTensorParallel(e.target.checked)}
                          style={{ width: "auto", accentColor: "var(--accent)" }} />
                        <span style={{ fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-1)" }}>Tensor parallel</span>
                      </label>
                    </div>
                  </div>

                  <div className="params-grid">
                    <div>
                      <label>Chunk Size (0=default)</label>
                      <input type="number" value={chunkSize} onChange={e => setChunkSize(+e.target.value)}
                        title="Prompt ingestion chunk size (512-4096)." />
                    </div>
                    <div>
                      <label>Rope Scale (0=default)</label>
                      <input type="number" value={ropeScale} onChange={e => setRopeScale(+e.target.value)} step="0.1" />
                    </div>
                    <div style={{ display: "flex", alignItems: "end", gap: "0.5rem", paddingBottom: "0.15rem" }}>
                      <label style={{ display: "flex", alignItems: "center", gap: "0.4rem", cursor: "pointer", whiteSpace: "nowrap" }}>
                        <input type="checkbox" checked={vision} onChange={e => setVision(e.target.checked)}
                          style={{ width: "auto", accentColor: "var(--accent)" }} />
                        <span style={{ fontSize: "0.72rem", fontFamily: "var(--font-mono)", color: "var(--text-1)" }}>Vision</span>
                      </label>
                    </div>
                  </div>

                  <div style={{ marginBottom: "1rem" }}>
                    <label style={labelStyle}>Prompt Template (empty = auto)</label>
                    <input type="text" value={promptTemplate} onChange={e => setPromptTemplate(e.target.value)}
                      placeholder="template name from tabbyAPI's templates folder" />
                  </div>
                </>
              )}

              <div style={{ display: "flex", gap: "0.5rem" }}>
                <button className="btn-primary" onClick={handleLoad} disabled={!selectedModel}>
                  Load Model
                </button>
                {selectedModel && (
                  <button className="btn-danger btn-sm" onClick={handleDelete}>
                    Delete
                  </button>
                )}
                <button className="btn-danger btn-sm" onClick={handleStopServer} style={{ marginLeft: "auto" }}>
                  Stop tabbyAPI
                </button>
              </div>
            </>
          )}

          {model.status === "loading" && (
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--accent)", marginBottom: "0.75rem" }}>
              Loading {model.name}&hellip; {model.progress}
            </div>
          )}

          {(model.status === "loaded" || model.status === "loading") && (
            <div style={{ display: "flex", gap: "0.5rem", alignItems: "center", flexWrap: "wrap" }}>
              {model.status === "loaded" && (
                <button className="btn-secondary" onClick={handleUnload}>
                  Unload Model
                </button>
              )}
              <button className="btn-danger btn-sm" onClick={handleStopServer}>
                Stop tabbyAPI
              </button>
            </div>
          )}

          <div style={{ marginTop: "0.75rem", display: "flex", gap: "0.5rem" }}>
            <button className="btn-secondary btn-sm" onClick={() => { setShowLog(v => !v); if (!showLog) setPolling(true); }}>
              {showLog ? "Hide Log" : "Show Log"}
            </button>
            {procStatus === "starting" && (
              <button className="btn-danger btn-sm" onClick={handleStopServer}>
                Stop tabbyAPI
              </button>
            )}
          </div>

          {model.status === "loaded" && (
            <div className="endpoint-banner">
              <code>http://localhost:{status.port}/v1/chat/completions</code>
              <p>
                OpenAI-compatible endpoint ready.
                Use with any client &mdash; <code>base_url=http://localhost:{status.port}/v1</code>
                {status.api_key && <> &middot; <code>api_key={status.api_key}</code></>}
              </p>
            </div>
          )}

          {status?.error && (
            <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
              Error: {status.error}
            </div>
          )}
          {model.error && (
            <div style={{ marginTop: "0.75rem", fontFamily: "var(--font-mono)", fontSize: "0.75rem", color: "var(--red)" }}>
              Load error: {model.error}
            </div>
          )}

          {showLog && (
            <div className="log-box" style={{ marginTop: "0.75rem", maxHeight: "300px" }}>
              {status.log || "(no output yet)"}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("llama");
  const modelsRefreshRef = useRef(null);
  const tabbyModelsRef = useRef(null);

  return (
    <>
      <div className="header">
        <h1>llama-cpp-webui</h1>
        <span className="version">v1.0</span>
        <div className="tabs">
          <button className={`tab${tab === "llama" ? " active" : ""}`} onClick={() => setTab("llama")}>llama.cpp</button>
          <button className={`tab${tab === "tabby" ? " active" : ""}`} onClick={() => setTab("tabby")}>exllamav3</button>
        </div>
      </div>
      {/* Both trees stay mounted so form state and polling survive tab switches */}
      <div style={{ display: tab === "llama" ? "" : "none" }}>
        <BuildSection />
        <DownloadSection refreshModels={() => modelsRefreshRef.current?.()} />
        <ModelSection modelsRef={modelsRefreshRef} />
      </div>
      <div style={{ display: tab === "tabby" ? "" : "none" }}>
        <TabbyBuildSection />
        <TabbyDownloadSection refreshModels={() => tabbyModelsRef.current?.()} />
        <TabbyServerSection modelsRef={tabbyModelsRef} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
